<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css">
  <title>Kontakt</title>
</head>

<body>
  <header>
    <h1 class="title">BRF Rymdsonden</h1>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Hem</a></li>
        <li><a href="boende.html">Boendeinformation</a></li>
        <li><a href="lagenheter.html">Lägenheter</a></li>

        <li><a class="active" href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <!--The main content begins here-->
  <main id="mainKontakt">
    <div id="kontaktForm">
      <h2>Kontakta oss</h2>
      <h3>Använd nedan formulär för att kontakta oss.</h3>
      <h4>Vi svarar ofta inom 24 timmar</h4>
      <form>
        <label for="name">Namn:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-post:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Meddelande:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <label for="boende">Är du boende hos oss idag?</label>
        <select id="boende" name="boende" required>
          <option value="">Välj</option>
          <option value="ja">Ja</option>
          <option value="nej">Nej</option>
        </select>

        <button type="submit">Skicka</button>
      </form>
    </div>
    <div id="karta">
      <h2>Vår adress</h2>
      <p>Brf Rymdsonden<br>
        Rymdvägen 42<br>
        123 45 Rymdstaden</p>
      <img id="kartBild" src="img/map-pin.jpg" alt="Karta över Brf Rymdsondens läge">
    </div>'
  </main>

  <footer>
    <section class="footerbrf">
      <p id="footerTitel">BRF Rymdsonden</p>
      <div class="footertext">
        <p>&copy; BRF Rymdsonden 2026</p>
      </div>
    </section>
  </footer>

</body>

</html>
